    <!-- PWA Configuration -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#cc0000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DatCARDVault" />
    <link rel="apple-touch-icon" href="/icon/icon-192.png" />

    <!-- Privacy & Permissions Policy — only camera and bluetooth are used -->
    <meta http-equiv="Permissions-Policy" content="camera=(self), bluetooth=(self), microphone=(), geolocation=(), payment=(), usb=()" />

    <!-- Fonts — only load the 3 actually used: Montserrat, Inter, Geist Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
      crossorigin
    />

    <!-- Apply theme before paint to prevent flash of wrong theme on load -->
    <script>
      try {
        // Check app-persisted theme first (set by useAppTheme after login)
        var dcvTheme = localStorage.getItem("dcv_theme");
        if (dcvTheme === "grey") {
          // grey uses light palette
        } else if (dcvTheme === "light") {
          // no class needed
        } else if (dcvTheme === "dark") {
          document.documentElement.classList.add("dark");
        } else {
          // No saved theme yet — default to dark (app default)
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>

    <link href="/src/index.css" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
